syntax = "proto3";

package acme.users.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "zara/customtag/options.proto";

option go_package = "github.com/aldok10/zara-rpc-examples/proto/users/v1;usersv1";

// UsersService demonstrates grpc-gateway-style HTTP endpoint definitions
// via google.api.http annotations.
service UsersService {
  // GET /v1/users/{id} -- path param, no body
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/users/{id}"
    };
  }

  // GET /v1/users -- query params, no body
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
  }

  // GET /v1/users/getByID?id=1 -- automatic query binding: fields not bound
  // by the path template or body become query parameters (google.api.http
  // rules), nested dot-paths and repeated fields included.
  rpc GetUserByID(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/users/getByID"
    };
  }

  // POST /v1/users -- body: "*"
  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }

  // PUT /v1/users/{id} -- path param + body: "*"
  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      put: "/v1/users/{id}"
      body: "*"
    };
  }

  // DELETE /v1/users/{id} -- path param, no body
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/users/{id}"
    };
  }

  // Multiple HTTP bindings via additional_bindings.
  rpc Echo(EchoRequest) returns (EchoResponse) {
    option (google.api.http) = {
      post: "/v1/echo"
      body: "*"
      additional_bindings {
        get: "/v1/echo/{message}"
      }
    };
  }

  // GET /v1/users/{id}/profile -- response_body selects a single field of
  // the response; the HTTP body is just the name, not the full User.
  rpc GetUserProfile(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/users/{id}/profile"
      response_body: "name"
    };
  }

  // POST /v1/users/{name}:activate -- custom verb with a path param.
  rpc ActivateUser(ActivateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/users/{name}:activate"
    };
  }

  // Server streaming: GET /v1/users:watch -- responses streamed as SSE.
  rpc WatchUsers(WatchUsersRequest) returns (stream User) {
    option (google.api.http) = {
      get: "/v1/users:watch"
    };
  }

  // Client streaming: POST /v1/users:upload -- requests streamed as NDJSON.
  rpc UploadUsers(stream User) returns (UploadUsersResponse) {
    option (google.api.http) = {
      post: "/v1/users:upload"
      body: "*"
    };
  }

  // Bidi streaming: POST /v1/chat -- WebSocket transport.
  rpc Chat(stream ChatMessage) returns (stream ChatMessage) {
    option (google.api.http) = {
      post: "/v1/chat"
      body: "*"
    };
  }
}

// AuthService demonstrates token issuance: register creates a user with a
// bcrypt-hashed password, login verifies credentials and returns a JWT.
// The endpoints are public (no auth chain) — they are how clients obtain
// tokens.
service AuthService {
  // POST /v1/auth/register -- create a user and return its id.
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  }

  // POST /v1/auth/login -- verify credentials and return a JWT.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }
}

message GetUserRequest {
  string id = 1;
}

message ListUsersRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
}

message UpdateUserRequest {
  string id = 1;
  string name = 2;
  string email = 3;
}

message DeleteUserRequest {
  string id = 1;
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
}

message ActivateUserRequest {
  string name = 1;
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
}

// UserRow is the GORM model for the users table. Like Todo, every field
// carries (zara.options.tags) so the generated struct is a valid database
// model (primary key, unique index, auto timestamps) with no hand-written
// mapping struct. The extra fields (password_hash, role) support the auth
// flow and are never exposed through the API — User is the wire type.
message UserRow {
  string id = 1 [(zara.options.tags) = "gorm:\"primaryKey;size:36\" mapstructure:\"id\""];
  string name = 2 [(zara.options.tags) = "gorm:\"size:255;not null\" mapstructure:\"name\""];
  string email = 3 [(zara.options.tags) = "gorm:\"uniqueIndex;size:255\" mapstructure:\"email\""];
  string password_hash = 4 [(zara.options.tags) = "gorm:\"column:password_hash;size:255\" mapstructure:\"password_hash\""];
  string role = 5 [(zara.options.tags) = "gorm:\"default:user;size:32\" mapstructure:\"role\""];
  int64 created_at = 6 [(zara.options.tags) = "gorm:\"autoCreateTime\" mapstructure:\"created_at\""];
  int64 updated_at = 7 [(zara.options.tags) = "gorm:\"autoUpdateTime\" mapstructure:\"updated_at\""];
}

message WatchUsersRequest {
  int32 interval_seconds = 1;
}

message UploadUsersResponse {
  int32 count = 1;
}

message ChatMessage {
  string user = 1;
  string text = 2;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  string role = 4;
}

message RegisterResponse {
  string id = 1;
  string username = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  User user = 2;
}