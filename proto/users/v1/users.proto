syntax = "proto3";

package acme.users.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "zara/customtag/options.proto";

option go_package = "github.com/aldok10/zara-rpc-examples/proto/users/v1;usersv1";

// UsersService demonstrates grpc-gateway-style HTTP endpoint definitions
// via google.api.http annotations.
service UsersService {
  // GET /v1/users/{id} -- path param, no body
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/users/{id}"
    };
  }

  // GET /v1/users -- query params, no body
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/users"
    };
  }

  // POST /v1/users -- body: "*"
  rpc CreateUser(CreateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/users"
      body: "*"
    };
  }

  // PUT /v1/users/{id} -- path param + body: "*"
  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option (google.api.http) = {
      put: "/v1/users/{id}"
      body: "*"
    };
  }

  // DELETE /v1/users/{id} -- path param, no body
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/users/{id}"
    };
  }

  // Multiple HTTP bindings via additional_bindings.
  rpc Echo(EchoRequest) returns (EchoResponse) {
    option (google.api.http) = {
      post: "/v1/echo"
      body: "*"
      additional_bindings {
        get: "/v1/echo/{message}"
      }
    };
  }

  // GET /v1/users/{id}/profile -- response_body selects a single field of
  // the response; the HTTP body is just the name, not the full User.
  rpc GetUserProfile(GetUserRequest) returns (User) {
    option (google.api.http) = {
      get: "/v1/users/{id}/profile"
      response_body: "name"
    };
  }

  // POST /v1/users/{name}:activate -- custom verb with a path param.
  rpc ActivateUser(ActivateUserRequest) returns (User) {
    option (google.api.http) = {
      post: "/v1/users/{name}:activate"
    };
  }

  // Server streaming: GET /v1/users:watch -- responses streamed as SSE.
  rpc WatchUsers(WatchUsersRequest) returns (stream User) {
    option (google.api.http) = {
      get: "/v1/users:watch"
    };
  }

  // Client streaming: POST /v1/users:upload -- requests streamed as NDJSON.
  rpc UploadUsers(stream User) returns (UploadUsersResponse) {
    option (google.api.http) = {
      post: "/v1/users:upload"
      body: "*"
    };
  }

  // Bidi streaming: POST /v1/chat -- WebSocket transport.
  rpc Chat(stream ChatMessage) returns (stream ChatMessage) {
    option (google.api.http) = {
      post: "/v1/chat"
      body: "*"
    };
  }
}

message GetUserRequest {
  string id = 1;
}

message ListUsersRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
}

message UpdateUserRequest {
  string id = 1;
  string name = 2;
  string email = 3;
}

message DeleteUserRequest {
  string id = 1;
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
}

message ActivateUserRequest {
  string name = 1;
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
}

message WatchUsersRequest {
  int32 interval_seconds = 1;
}

message UploadUsersResponse {
  int32 count = 1;
}

message ChatMessage {
  string user = 1;
  string text = 2;
}

// StructNamed demonstrates custom struct tags on generated Go structs via
// the (zara.options.tags) field option. protoc-gen-zararpc emits the tags
// as users.tags.go; zararpc-tags applies them to the generated users.pb.go
// struct so reflection-based libraries (encoding/xml, gorm, mapstructure,
// ...) see them.
message StructNamed {
  bool flag = 1 [(zara.options.tags) = "xml:\"flag,attr\" gorm:\"primaryKey\""];
  string name = 2 [(zara.options.tags) = "mapstructure:\"name\""];
}

// StructOneof demonstrates custom struct tags on oneofs via the
// (zara.options.oneof_tags) oneof option. The tags land on the oneof field
// (Payload) of the StructOneof message struct.
message StructOneof {
  oneof payload {
    option (zara.options.oneof_tags) = "xml:\"payload,attr\"";
    string text = 1;
    int32 count = 2;
  }
}