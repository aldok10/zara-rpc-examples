syntax = "proto3";

package zara.options;

option go_package = "github.com/aldok10/zara-rpc-examples/proto/zara/customtag;customtag";

import "google/protobuf/descriptor.proto";

// Custom struct tag annotations for generated Go structs. The value is the
// full struct tag literal, exactly as it should appear on the Go struct:
//
//	message StructNamed {
//	  bool flag = 1 [(zara.options.tags) = "xml:\"flag,attr\" gorm:\"primaryKey\""];
//	  string name = 2 [(zara.options.tags) = "mapstructure:\"name\""];
//	}
//
// Existing tags (protobuf, json) are preserved; a key that is already
// present is replaced, others are appended. protoc-gen-zararpc reads this
// option and patches the tags directly into the generated .pb.go structs so
// reflection-based libraries (encoding/xml, gorm, mapstructure, ...) see
// them.
extend google.protobuf.FieldOptions {
  // The full struct tag literal for the field, e.g.
  // `xml:"flag,attr" gorm:"primaryKey"`.
  string tags = 50001;
}

// Struct tags for the oneof field on the message struct (e.g. Payload in
// StructOneof). Field-level tags on oneof members target the synthesized
// Message_Field wrapper structs instead.
extend google.protobuf.OneofOptions {
  // The full struct tag literal for the oneof field.
  string oneof_tags = 50002;
}